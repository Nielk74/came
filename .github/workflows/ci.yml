name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'm4-pro' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: ${{ runner.environment == 'github-hosted' && 'gradle' || '' }}

      - name: Set up Android SDK
        if: runner.environment == 'github-hosted'
        uses: android-actions/setup-android@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build, lint and test
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/test-results/
